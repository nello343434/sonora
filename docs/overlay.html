<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body { height: 100%; background: transparent !important; overflow: hidden; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #fff; }
.card { position: absolute; left: 8px; right: 8px; top: 8px; height: 54px; will-change: transform, opacity; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 7px; border-radius: 14px; background: #0e0e10; border: 1px solid rgba(255,255,255,.07); box-shadow: none; -webkit-app-region: drag; overflow: hidden; }
.art { width: 40px; height: 40px; border-radius: 9px; background: #2a2a2d center/cover; flex-shrink: 0; }
.tx { flex: 1; min-width: 0; }
.t { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a { color: #8e8e95; font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct { display: flex; align-items: center; gap: 2px; -webkit-app-region: no-drag; }
button { background: none; border: 0; color: #cfcfd4; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .12s, color .12s; }
button:hover { background: rgba(255,255,255,.1); color: #fff; }
button { padding: 0; line-height: 0; } button svg { width: 17px; height: 17px; display: block; fill: currentColor; flex: none; }
.hb svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; } .hb.on { color: #fff; } .hb.on svg { fill: currentColor; }
.pp { background: #fff; color: #000; width: 34px; height: 34px; margin: 0 2px; } .pp:hover { background: #e6e6e6; color: #000; }
.card.pre { opacity: 0; transform: translateY(260px) scale(.96); }
.card.in { animation: fly .62s cubic-bezier(.2,.9,.25,1.12) both; }
.card.out { animation: bye .26s cubic-bezier(.5,0,.9,.5) both; }
@keyframes fly { from { opacity: 0; transform: translateY(260px) scale(.96); } 35% { opacity: 1; } to { opacity: 1; transform: none; } }
@keyframes bye { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-26px) scale(.97); } }
.empty .t { color: #8e8e95; font-weight: 500; }
</style></head><body>
<div class="card pre" id="c"><div class="art" id="art"></div>
  <div class="tx"><div class="t" id="t">Rien en lecture</div><div class="a" id="a"></div></div>
  <div class="ct"><button class="hb" data-c="like" id="hb" title="Aimer"><svg viewBox="0 0 24 24"><path d="M12 20.500s-7.500-4.600-9.200-9.200C1.800 8.200 3.600 5 6.800 5c2 0 3.500 1.200 5.200 3 1.700-1.800 3.200-3 5.200-3 3.200 0 5 3.200 4 6.300-1.700 4.600-9.200 9.200-9.200 9.200z"/></svg></button>
    <button data-c="prev"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="pp" data-c="play" id="pp"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button data-c="next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button></div></div>
<script>
const $ = (i) => document.getElementById(i);
const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
document.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => window.ovl.cmd(b.dataset.c));
window.ovl.onAnim((a) => { const c = $('c'); c.classList.remove('in', 'out', 'pre'); if (a === 'prep') c.classList.add('pre'); else { void c.offsetWidth; c.classList.add(a); } });
window.ovl.onState((s) => {
  document.body.style.opacity = s.opacity || 1; $('c').classList.toggle('empty', !s.title);
  $('t').textContent = s.title || 'Rien en lecture'; $('a').textContent = s.artist || '';
  $('art').style.backgroundImage = s.image ? "url('" + s.image.replace(/'/g, '%27') + "')" : '';
  $('hb').classList.toggle('on', !!s.liked);
  const pp = $('pp'), h = s.playing ? PAUSE : PLAY; if (pp.dataset.h !== (s.playing ? '1' : '0')) { pp.dataset.h = s.playing ? '1' : '0'; pp.innerHTML = h; }
});
</script></body></html>
