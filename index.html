<div id="app">

    <nav>
      <button class="nav" data-view="home" title="Accueil">⌂ <span>Accueil</span></button>
      <button class="nav" data-view="collection" title="Bibliothèque">▤ <span>Bibliothèque</span></button>
    </nav>
    <div class="side-title">
      <span>Playlists</span>
      <button id="new-playlist" class="icon-btn" title="Nouvelle playlist">＋</button>
    </div>
    <div id="playlists" class="side-list"></div>
    <button class="nav bottom" data-view="settings" title="Apparence">⚙ <span>Apparence</span></button>
  </aside>

  <header id="topbar" class="panel">
    <div class="tb-search">
      <span class="tb-ico">⌕</span>
      <input id="search-input" placeholder="Que veux-tu écouter ? (ou colle un lien de playlist)" autocomplete="off" spellcheck="false">
      <button id="tb-clear" class="icon-btn hidden" data-act="clear-search" title="Effacer">✕</button>
    </div>
  </header>

  <main id="main" class="panel"></main>

  <footer id="player" class="panel">
    <div class="np">
      <div id="np-art" class="art"></div>
      <div class="np-text">
        <div id="np-title">Rien en lecture</div>
        <div id="np-artist"></div>
      </div>
      <button id="np-like" class="icon-btn" title="Ajouter aux titres aimés">♡</button>
    </div>
    <div class="center">
      <div class="controls">
        <button id="btn-shuffle" class="icon-btn" title="Aléatoire">⤮</button>
        <button id="btn-prev" class="icon-btn" title="Précédent">⏮</button>
        <button id="btn-play" class="play-btn" title="Lecture / pause">▶</button>
        <button id="btn-next" class="icon-btn" title="Suivant">⏭</button>
        <button id="btn-repeat" class="icon-btn" title="Répéter">⟲</button>
      </div>
      <div class="seek">
        <span id="t-cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0">
        <span id="t-dur">0:00</span>
      </div>
    </div>
    <div class="right">
      <button id="btn-lyrics" class="icon-btn" title="Paroles"></button>
      <button id="btn-queue" class="icon-btn" title="File d'attente">≡</button>
      <button id="btn-mute" class="icon-btn" title="Muet">🔊</button>
      <input id="volume" type="range" min="0" max="100" value="80">
      <button id="btn-mini" class="icon-btn" title="Mode compact (masquer la barre latérale)"></button>
      <button id="btn-full" class="icon-btn" title="Plein écran"></button>
    </div>
  </footer>
</div>

<div id="menu" class="menu hidden"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<div id="yt-holder" style="position:fixed;left:-9999px;top:0;width:220px;height:220px;overflow:hidden;">
  <div id="yt-player"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>
<script src="icons.js"></script>
<script src="discover.js"></script>
<script src="import.js"></script>
<script src="nowplaying.js"></script>
<script src="player-full.js"></script>
<script src="settings-icon.js"></script>
<script src="queue-panel.js"></script>
<script src="playlists.js"></script>
<script src="animated-bg.js"></script>
</body>
</html>
